<!-- Vehicle Filters Sidebar Component (Exact match to specification) -->
<aside class="vehicle-filters-sidebar" id="vehicleFiltersSidebar">
    <!-- Header: Filter by & Reset all -->
    <div class="filters-header">
        <h3 class="filters-title">Filter by</h3>
        <button type="button" class="filters-reset-btn" id="resetFiltersBtn">
            Reset all <span>&times;</span>
        </button>
    </div>

    <form id="vehicleFilterForm" class="filters-form" onsubmit="return false;">
        <!-- 1. Rental Type -->
        <div class="filter-section">
            <label class="section-label">Rental Type</label>
            <div class="pill-group" data-filter="rental-type">
                <button type="button" class="filter-pill">Any</button>
                <button type="button" class="filter-pill">Per day</button>
                <button type="button" class="filter-pill active">Per hour</button>
            </div>
        </div>

        <div class="filter-divider"></div>

        <!-- 2. Available Now Only Toggle -->
        <div class="filter-section toggle-row">
            <span class="section-label mb-0">Available now only</span>
            <label class="switch">
                <input type="checkbox" id="availableNowToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="filter-divider"></div>

        <!-- 3. Price Range / Hour Histogram Slider -->
        <div class="filter-section collapsible open" id="priceSection">
            <div class="collapsible-header" onclick="toggleFilterSection('priceSection')">
                <label class="section-label mb-0">Price Range / Hour</label>
                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </div>
            <div class="collapsible-content">
                <!-- Histogram Bars Visualization -->
                <div class="histogram-wrapper">
                    <div class="histogram-bars">
                        <span class="hist-bar" style="height: 18%;"></span>
                        <span class="hist-bar" style="height: 25%;"></span>
                        <span class="hist-bar in-range" style="height: 38%;"></span>
                        <span class="hist-bar in-range" style="height: 48%;"></span>
                        <span class="hist-bar in-range" style="height: 55%;"></span>
                        <span class="hist-bar in-range" style="height: 72%;"></span>
                        <span class="hist-bar in-range" style="height: 85%;"></span>
                        <span class="hist-bar in-range" style="height: 96%;"></span>
                        <span class="hist-bar in-range" style="height: 100%;"></span>
                        <span class="hist-bar in-range" style="height: 92%;"></span>
                        <span class="hist-bar in-range" style="height: 88%;"></span>
                        <span class="hist-bar in-range" style="height: 80%;"></span>
                        <span class="hist-bar in-range" style="height: 70%;"></span>
                        <span class="hist-bar in-range" style="height: 62%;"></span>
                        <span class="hist-bar in-range" style="height: 48%;"></span>
                        <span class="hist-bar in-range" style="height: 40%;"></span>
                        <span class="hist-bar in-range" style="height: 35%;"></span>
                        <span class="hist-bar in-range" style="height: 28%;"></span>
                        <span class="hist-bar in-range" style="height: 32%;"></span>
                        <span class="hist-bar in-range" style="height: 45%;"></span>
                        <span class="hist-bar in-range" style="height: 60%;"></span>
                        <span class="hist-bar" style="height: 70%;"></span>
                        <span class="hist-bar" style="height: 76%;"></span>
                        <span class="hist-bar" style="height: 82%;"></span>
                        <span class="hist-bar" style="height: 86%;"></span>
                    </div>

                    <!-- Dual Handle Slider Track -->
                    <div class="dual-range-track">
                        <div class="track-highlight" style="left: 8%; right: 20%;"></div>
                        <div class="range-handle handle-min" style="left: 8%;"></div>
                        <div class="range-handle handle-max" style="left: 80%;"></div>
                    </div>
                </div>

                <!-- From / To Price Inputs -->
                <div class="price-inputs-row">
                    <div class="price-box">
                        <span class="price-box-label">FROM</span>
                        <span class="price-box-val">$19.00</span>
                    </div>
                    <div class="price-box">
                        <span class="price-box-label">TO</span>
                        <span class="price-box-val">$98.50</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="filter-divider"></div>

        <!-- 4. Car Brand (Collapsible Dropdown) -->
        <div class="filter-section collapsible" id="brandSection">
            <div class="collapsible-header" onclick="toggleFilterSection('brandSection')">
                <label class="section-label mb-0">Car Brand</label>
                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
            <div class="collapsible-content">
                <select class="filter-custom-select" name="brand">
                    <option value="">All Brands</option>
                    <option value="mercedes">Mercedes-Benz</option>
                    <option value="bmw">BMW</option>
                    <option value="audi">Audi</option>
                    <option value="porsche">Porsche</option>
                    <option value="toyota">Toyota</option>
                </select>
            </div>
        </div>

        <div class="filter-divider"></div>

        <!-- 5. Car Model & Year (Collapsible Dropdown) -->
        <div class="filter-section collapsible" id="modelSection">
            <div class="collapsible-header" onclick="toggleFilterSection('modelSection')">
                <label class="section-label mb-0">Car Model & Year</label>
                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
            <div class="collapsible-content">
                <div class="sub-filter-row">
                    <input type="text" class="filter-text-input" placeholder="e.g. M4, E320, RS6">
                    <input type="number" class="filter-text-input year-narrow" placeholder="Year" min="2000" max="2027">
                </div>
            </div>
        </div>

        <div class="filter-divider"></div>

        <!-- 6. Body Type -->
        <div class="filter-section collapsible open" id="bodyTypeSection">
            <div class="collapsible-header" onclick="toggleFilterSection('bodyTypeSection')">
                <label class="section-label mb-0">Body Type</label>
                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </div>
            <div class="collapsible-content">
                <div class="checkbox-grid-2col">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="body_type" value="sedan" checked>
                        <span class="checkmark"></span>
                        <span class="cb-label">Sedan</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="body_type" value="wagon">
                        <span class="checkmark"></span>
                        <span class="cb-label">Wagon</span>
                    </label>

                    <label class="custom-checkbox">
                        <input type="checkbox" name="body_type" value="coupe" checked>
                        <span class="checkmark"></span>
                        <span class="cb-label">Coupe</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="body_type" value="hatchback" checked>
                        <span class="checkmark"></span>
                        <span class="cb-label">Hatchback</span>
                    </label>

                    <label class="custom-checkbox">
                        <input type="checkbox" name="body_type" value="pickup">
                        <span class="checkmark"></span>
                        <span class="cb-label">Pickup</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="body_type" value="sport_coupe">
                        <span class="checkmark"></span>
                        <span class="cb-label">Sport coupe</span>
                    </label>

                    <label class="custom-checkbox">
                        <input type="checkbox" name="body_type" value="crossover" checked>
                        <span class="checkmark"></span>
                        <span class="cb-label">Crossover</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="body_type" value="van" checked>
                        <span class="checkmark"></span>
                        <span class="cb-label">Van</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="filter-divider"></div>

        <!-- 7. Transmission -->
        <div class="filter-section collapsible open" id="transmissionSection">
            <div class="collapsible-header" onclick="toggleFilterSection('transmissionSection')">
                <label class="section-label mb-0">Transmission</label>
                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </div>
            <div class="collapsible-content">
                <div class="pill-group" data-filter="transmission">
                    <button type="button" class="filter-pill active">Any</button>
                    <button type="button" class="filter-pill">Automatic</button>
                    <button type="button" class="filter-pill">Manual</button>
                </div>
            </div>
        </div>

        <div class="filter-divider"></div>

        <!-- 8. Fuel Type -->
        <div class="filter-section collapsible open" id="fuelTypeSection">
            <div class="collapsible-header" onclick="toggleFilterSection('fuelTypeSection')">
                <label class="section-label mb-0">Fuel Type</label>
                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </div>
            <div class="collapsible-content">
                <div class="checkbox-grid-2col">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="fuel_type" value="gasoline" checked>
                        <span class="checkmark"></span>
                        <span class="cb-label">Gasoline</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="fuel_type" value="flex_fuel" checked>
                        <span class="checkmark"></span>
                        <span class="cb-label">Flex Fuel (E85)</span>
                    </label>

                    <label class="custom-checkbox">
                        <input type="checkbox" name="fuel_type" value="diesel">
                        <span class="checkmark"></span>
                        <span class="cb-label">Diesel</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="fuel_type" value="hybrid">
                        <span class="checkmark"></span>
                        <span class="cb-label">Hybrid</span>
                    </label>

                    <label class="custom-checkbox">
                        <input type="checkbox" name="fuel_type" value="electric" checked>
                        <span class="checkmark"></span>
                        <span class="cb-label">Electric</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="fuel_type" value="hydrogen">
                        <span class="checkmark"></span>
                        <span class="cb-label">Hydrogen</span>
                    </label>

                    <label class="custom-checkbox">
                        <input type="checkbox" name="fuel_type" value="other">
                        <span class="checkmark"></span>
                        <span class="cb-label">Other</span>
                    </label>
                </div>
            </div>
        </div>
    </form>
</aside>

<script>
    // Toggle collapsible accordion sections
    function toggleFilterSection(sectionId) {
        const section = document.getElementById(sectionId);
        if (section) {
            section.classList.toggle('open');
        }
    }

    // Interactive Pill Selection
    document.querySelectorAll('.pill-group .filter-pill').forEach(btn => {
        btn.addEventListener('click', function() {
            const parent = this.closest('.pill-group');
            parent.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // Reset All Filters
    document.getElementById('resetFiltersBtn')?.addEventListener('click', function() {
        const form = document.getElementById('vehicleFilterForm');
        if (form) {
            form.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            form.querySelectorAll('.filter-pill').forEach((p, idx) => {
                p.classList.remove('active');
                if (idx === 0) p.classList.add('active');
            });
            const toggle = document.getElementById('availableNowToggle');
            if (toggle) toggle.checked = false;
        }
    });
</script>
