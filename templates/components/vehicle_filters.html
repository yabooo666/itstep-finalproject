<!-- Vehicle Filters Sidebar Component (100% Functional & Monochromatic Luxury Aesthetic) -->
<aside class="vehicle-filters-sidebar" id="vehicleFiltersSidebar">
    <!-- Header: Filter by & Reset all -->
    <div class="filters-header">
        <h3 class="filters-title">Filter by</h3>
        <a href="{% url 'vehicles' %}" class="filters-reset-btn" id="resetFiltersBtn">
            Reset all <span>&times;</span>
        </a>
    </div>

    <form id="vehicleFilterForm" class="filters-form" action="{% url 'vehicles' %}" method="GET">
        <!-- Preserved Query & Sort Inputs -->
        {% if selected_q %}
        <input type="hidden" name="q" value="{{ selected_q }}">
        {% endif %}
        <input type="hidden" name="sort" id="filterSortInput" value="{{ selected_sort|default:'' }}">

        <!-- 1. City / Location Filter -->
        <div class="filter-section collapsible open" id="citySection">
            <div class="collapsible-header" onclick="toggleFilterSection('citySection')">
                <label class="section-label mb-0">City / Location</label>
                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </div>
            <div class="collapsible-content">
                <select class="filter-custom-select" name="city" id="filterCitySelect">
                    <option value="">All Locations</option>
                    {% for c in available_cities %}
                    <option value="{{ c }}" {% if selected_city|lower == c|lower %}selected{% endif %}>{{ c }}</option>
                    {% empty %}
                    <option value="Tbilisi" {% if selected_city|lower == 'tbilisi' %}selected{% endif %}>Tbilisi</option>
                    <option value="Batumi" {% if selected_city|lower == 'batumi' %}selected{% endif %}>Batumi</option>
                    <option value="Kutaisi" {% if selected_city|lower == 'kutaisi' %}selected{% endif %}>Kutaisi</option>
                    <option value="Rustavi" {% if selected_city|lower == 'rustavi' %}selected{% endif %}>Rustavi</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="filter-divider"></div>

        <!-- 2. Car Brand Filter -->
        <div class="filter-section collapsible open" id="brandSection">
            <div class="collapsible-header" onclick="toggleFilterSection('brandSection')">
                <label class="section-label mb-0">Car Brand</label>
                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </div>
            <div class="collapsible-content">
                <select class="filter-custom-select" name="brand" id="filterBrandSelect">
                    <option value="">All Brands</option>
                    {% for b in available_brands %}
                    <option value="{{ b }}" {% if selected_brand|lower == b|lower %}selected{% endif %}>{{ b }}</option>
                    {% empty %}
                    <option value="BMW">BMW</option>
                    <option value="Mercedes-Benz">Mercedes-Benz</option>
                    <option value="Porsche">Porsche</option>
                    <option value="Audi">Audi</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="filter-divider"></div>

        <!-- 3. Model & Year -->
        <div class="filter-section collapsible open" id="modelSection">
            <div class="collapsible-header" onclick="toggleFilterSection('modelSection')">
                <label class="section-label mb-0">Model & Year</label>
                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </div>
            <div class="collapsible-content">
                <div class="model-year-group">
                    <input type="text" 
                           name="model" 
                           id="filterModelInput"
                           class="filter-text-input model-full-input" 
                           placeholder="Model (e.g. M4, 911)" 
                           value="{{ selected_model|default:'' }}">
                    <div class="sub-filter-row">
                        <input type="number" 
                               name="year_min" 
                               id="filterYearMinInput"
                               class="filter-text-input" 
                               placeholder="Min Year" 
                               min="1990" 
                               max="2030" 
                               value="{{ selected_year_min|default:'' }}">
                        <input type="number" 
                               name="year_max" 
                               id="filterYearMaxInput"
                               class="filter-text-input" 
                               placeholder="Max Year" 
                               min="1990" 
                               max="2030" 
                               value="{{ selected_year_max|default:'' }}">
                    </div>
                </div>
            </div>
        </div>

        <div class="filter-divider"></div>

        <!-- 4. Daily Rental Rate Range (₾ GEL) -->
        <div class="filter-section collapsible open" id="priceSection">
            <div class="collapsible-header" onclick="toggleFilterSection('priceSection')">
                <label class="section-label mb-0">Daily Rate (₾ GEL)</label>
                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </div>
            <div class="collapsible-content">
                <div class="price-inputs-row">
                    <div class="price-box">
                        <span class="price-box-label">MIN RATE</span>
                        <div class="price-input-adorned">
                            <span class="currency-sym">₾</span>
                            <input type="number" 
                                   name="price_min" 
                                   id="filterPriceMin"
                                   class="price-clean-input" 
                                   placeholder="0" 
                                   min="0" 
                                   step="10" 
                                   value="{{ selected_price_min|default:'' }}">
                        </div>
                    </div>
                    <div class="price-box">
                        <span class="price-box-label">MAX RATE</span>
                        <div class="price-input-adorned">
                            <span class="currency-sym">₾</span>
                            <input type="number" 
                                   name="price_max" 
                                   id="filterPriceMax"
                                   class="price-clean-input" 
                                   placeholder="1000" 
                                   min="0" 
                                   step="10" 
                                   value="{{ selected_price_max|default:'' }}">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="filter-divider"></div>

        <!-- 5. Transmission -->
        <div class="filter-section collapsible open" id="transmissionSection">
            <div class="collapsible-header" onclick="toggleFilterSection('transmissionSection')">
                <label class="section-label mb-0">Transmission</label>
                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </div>
            <div class="collapsible-content">
                <input type="hidden" name="transmission" id="filterTransmissionInput" value="{{ selected_transmission|default:'' }}">
                <div class="pill-group" data-filter="transmission">
                    <button type="button" class="filter-pill {% if not selected_transmission or selected_transmission == 'any' %}active{% endif %}" data-val="">Any</button>
                    <button type="button" class="filter-pill {% if selected_transmission|lower == 'automatic' %}active{% endif %}" data-val="Automatic">Automatic</button>
                    <button type="button" class="filter-pill {% if selected_transmission|lower == 'manual' %}active{% endif %}" data-val="Manual">Manual</button>
                    <button type="button" class="filter-pill {% if selected_transmission|lower == 'tiptronic' %}active{% endif %}" data-val="Tiptronic">Tiptronic</button>
                </div>
            </div>
        </div>

        <div class="filter-divider"></div>

        <!-- 6. Seating Capacity -->
        <div class="filter-section collapsible open" id="capacitySection">
            <div class="collapsible-header" onclick="toggleFilterSection('capacitySection')">
                <label class="section-label mb-0">Seating Capacity</label>
                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </div>
            <div class="collapsible-content">
                <input type="hidden" name="capacity" id="filterCapacityInput" value="{{ selected_capacity|default:'' }}">
                <div class="pill-group" data-filter="capacity">
                    <button type="button" class="filter-pill {% if not selected_capacity or selected_capacity == 'any' %}active{% endif %}" data-val="">Any</button>
                    <button type="button" class="filter-pill {% if selected_capacity == '2' %}active{% endif %}" data-val="2">2</button>
                    <button type="button" class="filter-pill {% if selected_capacity == '4' %}active{% endif %}" data-val="4">4</button>
                    <button type="button" class="filter-pill {% if selected_capacity == '5' %}active{% endif %}" data-val="5">5</button>
                    <button type="button" class="filter-pill {% if selected_capacity == '7' %}active{% endif %}" data-val="7">7+</button>
                </div>
            </div>
        </div>

        <div class="filter-divider"></div>

        <!-- Submit & Clear Actions -->
        <div class="filter-action-footer">
            <button type="submit" class="btn-apply-filter-sidebar" id="applyFilterBtn">
                Apply Filters
            </button>
        </div>
    </form>
</aside>

<script>
    // Collapsible accordion toggler
    function toggleFilterSection(sectionId) {
        const section = document.getElementById(sectionId);
        if (section) {
            section.classList.toggle('open');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const filterForm = document.getElementById('vehicleFilterForm');
        if (!filterForm) return;

        // Synchronize Top Sort Dropdown into Filter Form
        const topSortSelect = document.querySelector('.sort-select');
        const filterSortInput = document.getElementById('filterSortInput');
        if (topSortSelect && filterSortInput) {
            // Set initial value
            if (filterSortInput.value) {
                topSortSelect.value = filterSortInput.value;
            }
            topSortSelect.addEventListener('change', () => {
                filterSortInput.value = topSortSelect.value;
                filterForm.submit();
            });
        }

        // Pill button selection handler (Transmission & Capacity)
        document.querySelectorAll('.pill-group .filter-pill').forEach(btn => {
            btn.addEventListener('click', function() {
                const group = this.closest('.pill-group');
                const filterType = group.getAttribute('data-filter');
                group.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                this.classList.add('active');

                const val = this.getAttribute('data-val');
                if (filterType === 'transmission') {
                    document.getElementById('filterTransmissionInput').value = val;
                } else if (filterType === 'capacity') {
                    document.getElementById('filterCapacityInput').value = val;
                }
                filterForm.submit();
            });
        });

        // Auto-submit on select changes
        const citySelect = document.getElementById('filterCitySelect');
        const brandSelect = document.getElementById('filterBrandSelect');
        citySelect?.addEventListener('change', () => filterForm.submit());
        brandSelect?.addEventListener('change', () => filterForm.submit());

        // Debounced submit on text inputs (Enter key or on change)
        filterForm.querySelectorAll('input[type="text"], input[type="number"]').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    filterForm.submit();
                }
            });
        });
    });
</script>
