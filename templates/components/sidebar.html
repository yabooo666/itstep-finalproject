<!-- Sidebar Component (Reusable across all pages) -->
<aside class="site-sidebar" id="siteSidebar">
    <!-- Toggle Collapse/Expand Button with < and > -->
    <button type="button" class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Toggle Sidebar (Collapse / Expand)"
        aria-label="Toggle Sidebar">
        <span class="toggle-icon-lt">&lt;</span>
        <span class="toggle-icon-gt">&gt;</span>
    </button>

    <!-- Brand Logo Header -->
    <div class="sidebar-header">
        <a href="/" class="sidebar-brand" aria-label="Gruzin Auto">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none">
                    <path
                        d="M5.5 17.5C4 16 3 13.5 4 10C5.5 4.5 12 3 17 4.5C20.5 5.5 21.5 8 20 12C18.5 16 14.5 19.5 9 19C7.5 19 6.2 18.2 5.5 17.5Z"
                        fill="white" />
                </svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">Gruzin</span>
                <span class="brand-sub">Auto</span>
            </div>
        </a>
    </div>

    <!-- Navigation List -->
    <nav class="sidebar-nav">
        <!-- Top Navigation Links -->
        <div class="nav-group">
            <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}" title="Home">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span>Home</span>
            </a>

            <a href="/vehicles/" class="nav-item {% if '/vehicles' in request.path %}active{% endif %}"
                title="Vehicles">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-4.66l.12-.34h13.77l.11.34V17z" />
                    <circle cx="7.5" cy="14.5" r="1.5" />
                    <circle cx="16.5" cy="14.5" r="1.5" />
                </svg>
                <span>Vehicles</span>
            </a>

            <a href="/favourites/" class="nav-item {% if '/favourites' in request.path %}active{% endif %}"
                title="Favourites">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
                <span>Favourites</span>
            </a>

            {% if request.user.is_authenticated %}
            <a href="{% url 'profile' %}" class="nav-item {% if '/profile' in request.path %}active{% endif %}"
                title="Profile">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span>Profile</span>
            </a>
            {% endif %}

            <a href="/notifications/" class="nav-item {% if '/notifications' in request.path %}active{% endif %}"
                title="Notifications">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
                <span>Notifications</span>
            </a>

            <a href="/chat/" class="nav-item {% if '/chat' in request.path %}active{% endif %}" title="Chat">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
                <span>Chat</span>
            </a>
        </div>

        <!-- Recents Section with Divider -->
        <div class="sidebar-recents-container">
            <div class="recents-divider-bar">
                <span class="recents-divider-label">Recents</span>
            </div>

            <!-- Recents List (Real Data from Database) -->
            <div class="recents-list" id="sidebarRecentsList">
                {% for car in recent_vehicles %}
                <a href="/vehicles/?q={{ car.model|urlencode }}" class="recent-card" title="{{ car.brand }} {{ car.model }}">
                    <div class="recent-thumb">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-4.66l.12-.34h13.77l.11.34V17z" />
                            <circle cx="7.5" cy="14.5" r="1.5" />
                            <circle cx="16.5" cy="14.5" r="1.5" />
                        </svg>
                    </div>
                    <div class="recent-info">
                        <span class="recent-name">{{ car.brand }} {{ car.model }}</span>
                        <span class="recent-meta">₾{{ car.price_per_hour }} / hr</span>
                    </div>
                </a>
                {% empty %}
                <div class="recent-empty-prompt" style="padding: 10px 14px; font-size: 11px; color: var(--text-muted, #64748b);">
                    No recent views
                </div>
                {% endfor %}
            </div>
        </div>
    </nav>
</aside>

<!-- Sidebar Collapse / Expand Controller Script -->
<script>
    (function () {
        function applySidebarState() {
            const sidebar = document.getElementById('siteSidebar');
            const mainWrapper = document.querySelector('.main-wrapper');
            if (localStorage.getItem('sidebar_collapsed') === 'true') {
                sidebar?.classList.add('collapsed');
                mainWrapper?.classList.add('sidebar-collapsed');
            }
        }

        // Apply immediately if already parsed, and re-apply on DOMContentLoaded for mainWrapper
        applySidebarState();
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applySidebarState);
        }

        function initSidebarToggle() {
            const toggleBtn = document.getElementById('sidebarToggleBtn');
            const sidebar = document.getElementById('siteSidebar');
            if (!toggleBtn || !sidebar) return;

            toggleBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                const isCollapsed = sidebar.classList.toggle('collapsed');
                const mainWrapper = document.querySelector('.main-wrapper');
                if (mainWrapper) {
                    mainWrapper.classList.toggle('sidebar-collapsed', isCollapsed);
                }
                localStorage.setItem('sidebar_collapsed', isCollapsed ? 'true' : 'false');
                window.dispatchEvent(new Event('resize'));
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initSidebarToggle);
        } else {
            initSidebarToggle();
        }
    })();
</script>
