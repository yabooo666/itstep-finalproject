<!-- Reusable Search & Filter Component (Static UI Template) -->
<div class="search-filter-section">
    <form action="/vehicles/" method="GET" class="search-filter-form">
        <!-- Top Search Bar -->
        <div class="search-bar-row">
            <div class="search-input-wrapper">
                <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input 
                    type="text" 
                    name="q"
                    value="{{ request.GET.q|default:'' }}"
                    class="search-input" 
                    placeholder="Search by brand, model, or keywords (e.g. Mercedes, M4, BMW)..." 
                    autocomplete="off"
                />
            </div>
            <button type="submit" class="search-submit-btn">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <span>Search</span>
            </button>
        </div>

        <!-- Filter Controls Row -->
        <div class="filters-row">
            <!-- City Filter -->
            <div class="filter-group">
                <span class="filter-label">City</span>
                <select name="city" class="filter-select">
                    <option value="" {% if not request.GET.city %}selected{% endif %}>All Cities</option>
                    <option value="Tbilisi" {% if request.GET.city == 'Tbilisi' %}selected{% endif %}>Tbilisi</option>
                    <option value="Batumi" {% if request.GET.city == 'Batumi' %}selected{% endif %}>Batumi</option>
                    <option value="Kutaisi" {% if request.GET.city == 'Kutaisi' %}selected{% endif %}>Kutaisi</option>
                </select>
            </div>

            <!-- Year Range Filter -->
            <div class="filter-group">
                <span class="filter-label">Year</span>
                <div class="year-range-inputs">
                    <input 
                        type="number" 
                        name="year_min"
                        value="{{ request.GET.year_min|default:'' }}"
                        class="year-input" 
                        placeholder="Min" 
                        min="1990" 
                        max="2030" 
                    />
                    <span class="year-separator">–</span>
                    <input 
                        type="number" 
                        name="year_max"
                        value="{{ request.GET.year_max|default:'' }}"
                        class="year-input" 
                        placeholder="Max" 
                        min="1990" 
                        max="2030" 
                    />
                </div>
            </div>

            <!-- Capacity Filter -->
            <div class="filter-group">
                <span class="filter-label">Capacity</span>
                <select name="capacity" class="filter-select">
                    <option value="" {% if not request.GET.capacity %}selected{% endif %}>Any Capacity</option>
                    <option value="2" {% if request.GET.capacity == '2' %}selected{% endif %}>2 Seats</option>
                    <option value="4" {% if request.GET.capacity == '4' %}selected{% endif %}>4 Seats</option>
                    <option value="5" {% if request.GET.capacity == '5' %}selected{% endif %}>5 Seats</option>
                    <option value="7" {% if request.GET.capacity == '7' %}selected{% endif %}>7+ Seats</option>
                </select>
            </div>

            <!-- Apply Button -->
            <button type="submit" class="filter-select" style="cursor: pointer; font-weight: 800; padding: 0 18px; background-image: none; background: #ffffff; color: #000000; border: 1px solid #ffffff; border-radius: 8px;">
                Apply
            </button>
        </div>
    </form>
</div>
