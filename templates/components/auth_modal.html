{% load static %}
<!-- Auto Ultimate Auth Modal (Login / Register Popup) -->
<div class="auth-modal-backdrop" id="authModalBackdrop" aria-hidden="true">
    <div class="auth-modal-card" id="authModalCard" role="dialog" aria-modal="true" aria-labelledby="authModalHeading">
        <!-- Close Button -->
        <button type="button" class="auth-modal-close" id="authModalCloseBtn" aria-label="Close modal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>

        <!-- Brand Icon & Header -->
        <div class="auth-modal-header">
            <div class="auth-brand-badge">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M5.5 17.5C4 16 3 13.5 4 10C5.5 4.5 12 3 17 4.5C20.5 5.5 21.5 8 20 12C18.5 16 14.5 19.5 9 19C7.5 19 6.2 18.2 5.5 17.5Z" fill="white"/>
                    </svg>
                </div>
            </div>
            <h3 class="auth-modal-title" id="authModalHeading">Welcome to Auto Ultimate</h3>
            <p class="auth-modal-sub" id="authModalSubheading">Access your reservations, garage, and exclusive vehicles</p>
        </div>

        <!-- Segmented Tab Switcher -->
        <div class="auth-tab-bar" role="tablist">
            <button type="button" class="auth-tab-btn active" id="authTabLogin" role="tab" aria-selected="true" data-tab="login">
                <span>Sign In</span>
            </button>
            <button type="button" class="auth-tab-btn" id="authTabRegister" role="tab" aria-selected="false" data-tab="register">
                <span>Create Account</span>
            </button>
        </div>

        <!-- Tab 1: Login Form -->
        <div class="auth-form-panel active" id="authPanelLogin" role="tabpanel">
            <form class="auth-form" onsubmit="event.preventDefault();" novalidate>
                <!-- Phone or Email Field -->
                <div class="auth-field-group">
                    <label class="auth-label" for="loginIdentifier">Phone Number or Email</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                            </svg>
                        </span>
                        <input type="text" id="loginIdentifier" class="auth-input" placeholder="+995 599 12 34 56 or email" autocomplete="username">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="auth-field-group">
                    <div class="auth-label-row">
                        <label class="auth-label" for="loginPassword">Password</label>
                        <a href="#forgot" class="auth-forgot-link">Forgot password?</a>
                    </div>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="loginPassword" class="auth-input" placeholder="••••••••••••" autocomplete="current-password">
                        <button type="button" class="auth-eye-btn" aria-label="Toggle password visibility">
                            <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="auth-options-row">
                    <label class="auth-checkbox-label">
                        <input type="checkbox" class="auth-checkbox" checked>
                        <span class="auth-checkbox-custom"></span>
                        <span class="auth-checkbox-text">Keep me signed in</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-submit-btn">
                    <span>Sign In</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Tab 2: Register Form -->
        <div class="auth-form-panel" id="authPanelRegister" role="tabpanel">
            <form class="auth-form" onsubmit="event.preventDefault();" novalidate>
                <!-- Full Name Field -->
                <div class="auth-field-group">
                    <label class="auth-label" for="registerName">Full Name</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input type="text" id="registerName" class="auth-input" placeholder="e.g. Giorgi Beridze" autocomplete="name">
                    </div>
                </div>

                <!-- Phone Number Field (with Georgia country prefix) -->
                <div class="auth-field-group">
                    <label class="auth-label" for="registerPhone">Mobile Phone</label>
                    <div class="auth-input-wrapper has-country-badge">
                        <div class="country-code-badge" title="Georgia">
                            <span class="flag-icon">🇬🇪</span>
                            <span class="prefix-num">+995</span>
                        </div>
                        <input type="tel" id="registerPhone" class="auth-input input-with-prefix" placeholder="599 12 34 56" autocomplete="tel">
                    </div>
                </div>

                <!-- Email Field (Optional) -->
                <div class="auth-field-group">
                    <label class="auth-label" for="registerEmail">Email (Optional)</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </span>
                        <input type="email" id="registerEmail" class="auth-input" placeholder="name@example.com" autocomplete="email">
                    </div>
                </div>

                <!-- Create Password Field -->
                <div class="auth-field-group">
                    <label class="auth-label" for="registerPassword">Create Password</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="registerPassword" class="auth-input" placeholder="At least 8 characters" autocomplete="new-password">
                        <button type="button" class="auth-eye-btn" aria-label="Toggle password visibility">
                            <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Terms Checkbox -->
                <div class="auth-options-row">
                    <label class="auth-checkbox-label">
                        <input type="checkbox" class="auth-checkbox" checked>
                        <span class="auth-checkbox-custom"></span>
                        <span class="auth-checkbox-text">I agree to the <a href="#terms">Terms</a> and <a href="#privacy">Privacy Policy</a></span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-submit-btn">
                    <span>Create Account</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="8.5" cy="7" r="4"/>
                        <line x1="20" y1="8" x2="20" y2="14"/>
                        <line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Social Divider -->
        <div class="auth-divider">
            <span>Or continue with</span>
        </div>

        <!-- Social Buttons -->
        <div class="auth-social-row">
            <button type="button" class="social-auth-btn" aria-label="Continue with Google">
                <svg viewBox="0 0 24 24" class="social-svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg>
                <span>Google</span>
            </button>

            <button type="button" class="social-auth-btn" aria-label="Continue with Apple">
                <svg viewBox="0 0 24 24" class="social-svg" fill="currentColor">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.88c.66-.82 1.11-1.96.99-3.1-.96.04-2.11.64-2.8 1.44-.61.71-1.14 1.87-1 2.99 1.07.08 2.15-.52 2.81-1.33z"/>
                </svg>
                <span>Apple</span>
            </button>
        </div>

        <!-- Switcher Link at Bottom -->
        <div class="auth-modal-footer">
            <p id="authFooterSwitch">
                <span id="footerPromptText">Don't have an account?</span>
                <button type="button" class="auth-switch-link" id="footerSwitchBtn">Sign up</button>
            </p>
        </div>
    </div>
</div>
