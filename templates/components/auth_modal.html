{% load static %}
<!-- Gruzin Auto Auth Modal (Login / Register / Verification Popup) -->
<div class="auth-modal-backdrop" id="authModalBackdrop" aria-hidden="true">
    <div class="auth-modal-card" id="authModalCard" role="dialog" aria-modal="true" aria-labelledby="authModalHeading">
        <!-- Close Button -->
        <button type="button" class="auth-modal-close" id="authModalCloseBtn" aria-label="Close modal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>

        <!-- Brand Icon & Header -->
        <div class="auth-modal-header">
            <div class="auth-brand-badge">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path
                            d="M5.5 17.5C4 16 3 13.5 4 10C5.5 4.5 12 3 17 4.5C20.5 5.5 21.5 8 20 12C18.5 16 14.5 19.5 9 19C7.5 19 6.2 18.2 5.5 17.5Z"
                            fill="white" />
                    </svg>
                </div>
            </div>
            <h3 class="auth-modal-title" id="authModalHeading">Welcome to Gruzin Auto</h3>
            <p class="auth-modal-sub" id="authModalSubheading">Access your reservations, garage, and exclusive vehicles
            </p>
        </div>

        <!-- Segmented Tab Switcher -->
        <div class="auth-tab-bar" id="authTabBar" role="tablist">
            <button type="button" class="auth-tab-btn active" id="authTabLogin" role="tab" aria-selected="true"
                data-tab="login">
                <span>Sign In</span>
            </button>
            <button type="button" class="auth-tab-btn" id="authTabRegister" role="tab" aria-selected="false"
                data-tab="register">
                <span>Create Account</span>
            </button>
        </div>

        <!-- Tab 1: Login Form -->
        <div class="auth-form-panel active" id="authPanelLogin" role="tabpanel">
            <form class="auth-form" id="loginForm" novalidate>
                {% csrf_token %}

                <div class="auth-alert-box error" id="loginAlertBox" style="display: none;"></div>

                <!-- Email Field -->
                <div class="auth-field-group">
                    <label class="auth-label" for="loginEmail">Email Address</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                <polyline points="22,6 12,13 2,6" />
                            </svg>
                        </span>
                        <input type="email" id="loginEmail" name="email" class="auth-input"
                            placeholder="name@example.com" autocomplete="email" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="auth-field-group">
                    <div class="auth-label-row">
                        <label class="auth-label" for="loginPassword">Password</label>
                    </div>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input type="password" id="loginPassword" name="password" class="auth-input"
                            placeholder="••••••••••••" autocomplete="current-password" required>
                        <button type="button" class="auth-eye-btn" aria-label="Toggle password visibility">
                            <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-submit-btn" id="loginSubmitBtn">
                    <span>Sign In</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </button>
            </form>
        </div>

        <!-- Tab 2: Register Form (Email & Password Only) -->
        <div class="auth-form-panel" id="authPanelRegister" role="tabpanel">
            <form class="auth-form" id="registerForm" novalidate>
                {% csrf_token %}

                <div class="auth-alert-box error" id="registerAlertBox" style="display: none;"></div>

                <!-- Full Name Field -->
                <div class="auth-field-group">
                    <label class="auth-label" for="registerName">Full Name</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </span>
                        <input type="text" id="registerName" name="full_name" class="auth-input"
                            placeholder="e.g. Giorgi Beridze" autocomplete="name" required>
                    </div>
                </div>

                <!-- Email Field -->
                <div class="auth-field-group">
                    <label class="auth-label" for="registerEmail">Email Address</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                <polyline points="22,6 12,13 2,6" />
                            </svg>
                        </span>
                        <input type="email" id="registerEmail" name="email" class="auth-input"
                            placeholder="name@example.com" autocomplete="email" required>
                    </div>
                </div>

                <!-- Create Password Field -->
                <div class="auth-field-group">
                    <label class="auth-label" for="registerPassword">Password</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input type="password" id="registerPassword" name="password" class="auth-input"
                            placeholder="At least 8 characters" autocomplete="new-password" required>
                        <button type="button" class="auth-eye-btn" aria-label="Toggle password visibility">
                            <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="auth-field-group">
                    <label class="auth-label" for="registerConfirmPassword">Confirm Password</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input type="password" id="registerConfirmPassword" name="confirm_password" class="auth-input"
                            placeholder="Repeat your password" autocomplete="new-password" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-submit-btn" id="registerSubmitBtn">
                    <span>Create Account</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="8.5" cy="7" r="4" />
                        <line x1="20" y1="8" x2="20" y2="14" />
                        <line x1="23" y1="11" x2="17" y2="11" />
                    </svg>
                </button>
            </form>
        </div>

        <!-- Panel 3: Email Confirmation Sent Screen -->
        <div class="auth-form-panel" id="authPanelConfirmation" role="tabpanel" style="display: none;">
            <div class="auth-confirm-container">
                <div class="auth-confirm-icon-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                        <polyline points="22,6 12,13 2,6" />
                    </svg>
                </div>
                <h4 class="auth-confirm-heading">Check Your Inbox</h4>
                <p class="auth-confirm-desc">
                    We sent an activation link to <strong id="confirmEmailDisplay" style="color: #38bdf8;"></strong>.
                    Please check your email to activate your account.
                </p>
                <div class="auth-confirm-actions">
                    <button type="button" class="auth-submit-btn secondary" id="resendConfirmBtn">
                        <span>Resend Confirmation Email</span>
                    </button>
                    <button type="button" class="auth-switch-link" id="confirmToLoginBtn"
                        style="margin-top: 14px; font-size: 13px;">
                        &larr; Back to Sign In
                    </button>
                </div>
            </div>
        </div>

        <!-- Switcher Link at Bottom -->
        <div class="auth-modal-footer" id="authModalFooter">
            <p id="authFooterSwitch">
                <span id="footerPromptText">Don't have an account?</span>
                <button type="button" class="auth-switch-link" id="footerSwitchBtn">Sign up</button>
            </p>
        </div>
    </div>
</div>
